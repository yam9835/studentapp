name: Spring Boot CI CD with SonarQube

on:
  push:
    branches:
      - main

jobs:

  build-test-scan-docker-deploy:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout source code
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Maven build and JUnit testing
      - name: Maven Build and Test
        run: mvn -B clean verify

      # 4. SonarQube code quality analysis
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=springboot-docker-demo \
            -Dsonar.qualitygate.wait=true

      # 5. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 6. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/springboot-demo:${{ github.sha }}

      # 8. Deploy application on Ubuntu Server
      - name: Deploy Spring Boot Application
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/springboot-demo:${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: IMAGE
          script: |
            docker pull $IMAGE

            docker stop springboot-app || true

            docker rm springboot-app || true

            docker run -d \
              --name springboot-app \
              --restart unless-stopped \
              -p 8080:8080 \
              $IMAGE

            docker image prune -f
